<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Portal – Erniekay Beauty Lab</title>
  <link rel="stylesheet" href="style.css?v=2.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: #08111D;
      color: #F0F4F8;
      min-height: 100vh;
      font-family: var(--ff-body);
    }
    .admin-nav {
      background: #0B192C;
      border-bottom: 1px solid rgba(201,169,110,0.25);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--ff-heading);
      font-size: 1.4rem;
      color: var(--gold);
    }
    .admin-container {
      max-width: 1200px;
      margin: 36px auto;
      padding: 0 24px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: #112238;
      border: 1px solid rgba(201,169,110,0.22);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .stat-card-icon {
      width: 50px; height: 50px;
      border-radius: 10px;
      background: rgba(201,169,110,0.15);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .stat-card h4 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9BB0C7;
      margin-bottom: 4px;
    }
    .stat-card .val {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-light);
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 360px;
    }
    .search-box input {
      padding-left: 38px;
      background: #112238;
      border: 1px solid rgba(201,169,110,0.3);
      color: #fff;
    }
    .search-box i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: #9BB0C7;
    }
    .table-wrap {
      background: #112238;
      border: 1px solid rgba(201,169,110,0.22);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: #0D1B2A;
      padding: 16px 20px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold);
      border-bottom: 1px solid rgba(201,169,110,0.2);
    }
    td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.9rem;
      vertical-align: middle;
    }
    tr:hover td {
      background: rgba(201,169,110,0.04);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(245,166,35,0.2); color: #F5A623; border: 1px solid #F5A623; }
    .status-confirmed { background: rgba(37,211,102,0.2); color: #25D366; border: 1px solid #25D366; }
    .btn-wa-sm {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #25D366;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-wa-sm:hover { opacity: 0.9; }
    .pin-modal {
      position: fixed;
      inset: 0;
      background: rgba(8,17,29,0.96);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .pin-card {
      background: #112238;
      border: 1px solid rgba(201,169,110,0.3);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- Security PIN Modal -->
  <div class="pin-modal" id="pinModal">
    <div class="pin-card">
      <div style="font-size: 2.2rem; color: var(--gold); margin-bottom: 12px;"><i class="fas fa-lock"></i></div>
      <h3 style="font-family: var(--ff-heading); font-size: 1.6rem; color: var(--gold-light); margin-bottom: 8px;">Admin Security</h3>
      <p style="color: #9BB0C7; font-size: 0.88rem; margin-bottom: 20px;">Enter your admin PIN to access appointment bookings.</p>
      <input type="password" id="pinInput" placeholder="Enter PIN (Default: 1234)" style="text-align: center; font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 16px;"/>
      <button class="btn-primary" onclick="verifyPin()" style="width: 100%;">Unlock Portal</button>
      <p id="pinError" style="color: #D4847A; font-size: 0.8rem; margin-top: 10px; display: none;">Incorrect PIN. Try again.</p>
    </div>
  </div>

  <!-- Admin Navbar -->
  <header class="admin-nav">
    <div class="admin-title">
      <i class="fas fa-crown"></i>
      <span>Erniekay Beauty Lab &bull; Booking Management</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="index.html" class="btn-outline" style="padding: 8px 20px; font-size: 0.85rem;"><i class="fas fa-external-link-alt"></i> View Website</a>
      <button class="btn-primary" onclick="loadBookings()" style="padding: 8px 20px; font-size: 0.85rem;"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
  </header>

  <div class="admin-container">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card-icon"><i class="fas fa-calendar-check"></i></div>
        <div>
          <h4>Total Bookings</h4>
          <div class="val" id="totalCount">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon" style="color: #F5A623; background: rgba(245,166,35,0.15);"><i class="fas fa-clock"></i></div>
        <div>
          <h4>Pending Review</h4>
          <div class="val" id="pendingCount" style="color: #F5A623;">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon" style="color: #25D366; background: rgba(37,211,102,0.15);"><i class="fas fa-check-double"></i></div>
        <div>
          <h4>Confirmed</h4>
          <div class="val" id="confirmedCount" style="color: #25D366;">0</div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-row">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by name or phone..." onkeyup="filterBookings()"/>
      </div>
      <div style="display: flex; gap: 8px;">
        <select id="statusFilter" onchange="filterBookings()" style="width: auto; padding: 10px 16px; background: #112238; border: 1px solid rgba(201,169,110,0.3); color: #fff;">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
        </select>
      </div>
    </div>

    <!-- Bookings Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Client Name</th>
            <th>Contact</th>
            <th>Location</th>
            <th>Service</th>
            <th>Notes</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookingsTableBody">
          <tr>
            <td colspan="8" style="text-align: center; color: #9BB0C7; padding: 40px;">
              <i class="fas fa-spinner fa-spin"></i> Loading bookings...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const ADMIN_PIN = "1234"; // Default PIN, change anytime
    let allBookings = [];

    function verifyPin() {
      const entered = document.getElementById('pinInput').value.trim();
      if (entered === ADMIN_PIN) {
        document.getElementById('pinModal').style.display = 'none';
        sessionStorage.setItem('admin_unlocked', 'true');
        loadBookings();
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }

    // Auto-unlock if session already valid
    if (sessionStorage.getItem('admin_unlocked') === 'true') {
      document.getElementById('pinModal').style.display = 'none';
      loadBookings();
    }

    async function loadBookings() {
      const tbody = document.getElementById('bookingsTableBody');
      try {
        const res = await fetch('/api/bookings');
        allBookings = await res.json();
        renderTable(allBookings);
        updateStats(allBookings);
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; color: #9BB0C7; padding: 40px;">
              No bookings recorded yet. When a client submits the booking form, it will appear here!
            </td>
          </tr>
        `;
      }
    }

    function renderTable(bookings) {
      const tbody = document.getElementById('bookingsTableBody');
      if (!bookings || bookings.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; color: #9BB0C7; padding: 40px;">
              No bookings found.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = bookings.map(b => {
        const waNumber = (b.phone || '').replace(/[^0-9]/g, '');
        const waMsg = encodeURIComponent(`Hello ${b.full_name}! ✨ We are reaching out regarding your booking for ${b.service} on ${b.date} at ${b.time} with Erniekay Beauty Lab.`);
        const statusClass = b.status === 'confirmed' ? 'status-confirmed' : 'status-pending';

        return `
          <tr>
            <td>
              <strong>${b.date}</strong><br/>
              <small style="color: #9BB0C7;">${b.time}</small>
            </td>
            <td>
              <strong style="color: var(--gold-light);">${b.full_name}</strong>
            </td>
            <td>
              <a href="tel:${b.phone}" style="color: #fff; text-decoration: underline;">${b.phone}</a><br/>
              <small style="color: #9BB0C7;">${b.email || 'No email'}</small>
            </td>
            <td>${b.address}</td>
            <td><strong style="color: var(--gold);">${b.service}</strong></td>
            <td><small style="color: #9BB0C7;">${b.notes || '—'}</small></td>
            <td><span class="status-badge ${statusClass}">${b.status || 'pending'}</span></td>
            <td>
              <a class="btn-wa-sm" href="https://wa.me/${waNumber}?text=${waMsg}" target="_blank">
                <i class="fab fa-whatsapp"></i> Chat
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateStats(bookings) {
      document.getElementById('totalCount').innerText = bookings.length;
      document.getElementById('pendingCount').innerText = bookings.filter(b => b.status !== 'confirmed').length;
      document.getElementById('confirmedCount').innerText = bookings.filter(b => b.status === 'confirmed').length;
    }

    function filterBookings() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = allBookings.filter(b => {
        const matchesQuery = (b.full_name && b.full_name.toLowerCase().includes(q)) ||
                             (b.phone && b.phone.includes(q)) ||
                             (b.service && b.service.toLowerCase().includes(q));
        const matchesStatus = status === 'all' || (b.status || 'pending') === status;
        return matchesQuery && matchesStatus;
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
